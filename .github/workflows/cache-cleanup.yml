# Drops a closed pull request's caches, so they never push main's out of the 10 GB.

name: Cache cleanup

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh cache delete --all --ref "refs/pull/$PR/merge" --repo "$GITHUB_REPOSITORY" || echo "no caches left"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
