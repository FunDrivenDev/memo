# Releases main after CI passes on it. Each successful CI run on a push waits 5 minutes,
# then goes on only if its commit is still main's head, so commits merged close together
# ship as one release. The waits run side by side; only publishing, in publish.yml, takes
# one run at a time, so a release already building always ships, and a commit merged
# meanwhile settles on its own clock and ships right after.

name: Release

on:
  # Safe: only a successful run on a push to this repository's main goes on (see settle).
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  settle:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      head: ${{ steps.head.outputs.head }}
    steps:
      - name: Wait for merges to settle
        id: head
        run: |
          sleep 300
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          [[ "$head" == "$HEAD_SHA" ]] || { echo "main moved on to $head, whose run releases this commit too"; exit 0; }
          echo "head=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

  publish:
    needs: settle
    if: needs.settle.outputs.head == 'true'
    # One release at a time: a running one always finishes. GitHub keeps a single run
    # waiting behind it, and a newer one replaces it, as its commit holds the older one's.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    # actionlint does not know the newer `$/` form yet.
    uses: ./.github/workflows/publish.yml # zizmor: ignore[self-repository]
    with:
      sha: ${{ github.event.workflow_run.head_sha }}
