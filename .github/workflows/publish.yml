# Builds and releases one commit of main, called by release.yml once it has settled, one
# run at a time. The version bumps the patch of the last tag, or the minor or major when a
# pull request merged since carries the `minor` or `major` label. Only the app build needs
# macOS; Linux scans the app, tags the commit, releases it, and pushes the app to the
# Homebrew tap. Every step skips what already exists, so "Re-run failed jobs" finishes a
# broken release.

name: Publish

on:
  workflow_call:
    inputs:
      sha:
        description: The commit to release.
        required: true
        type: string

permissions: {}

jobs:
  version:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          # The tags and the commits since the last one.
          fetch-depth: 0
          persist-credentials: false

      # Chosen here, behind the previous release, so it follows that release's tag.
      - name: Choose the version
        id: version
        run: |
          # A tag already on the commit is a release to finish, done once published.
          tagged=$(git tag --points-at "$HEAD_SHA" --list 'v*' | head -1)
          if [[ -n "$tagged" ]]; then
            [[ "$(gh release view "$tagged" --json isDraft --jq .isDraft 2>/dev/null)" != false ]] || { echo "$tagged is already released"; exit 0; }
            echo "version=${tagged#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          IFS=. read -r major minor patch <<< "${last#v}"
          labels=$(git rev-list "$last..$HEAD_SHA" | while read -r sha; do
            gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --jq '.[] | select(.merged_at) | .labels[].name'
          done)
          if grep -qx major <<< "$labels"; then version="$((major + 1)).0.0"
          elif grep -qx minor <<< "$labels"; then version="$major.$((minor + 1)).0"
          else version="$major.$minor.$((patch + 1))"
          fi
          echo "$last -> $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.sha }}

  build:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # Nothing restored from a cache goes into the app.
          cache: false

      - name: Install the dependencies from the lockfiles
        run: just install frozen

      # The version goes into this build only; main keeps whatever Cargo.toml says.
      - name: Set the version, build and zip the app
        run: |
          just set-version "$VERSION"
          just build
          just package "$VERSION"
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Update Homebrew
        run: brew update --quiet

      # Before anything is published: the cask must still pass Homebrew's rules, and
      # install this very archive with its quarantine flag lifted.
      - name: Install the app from the cask
        run: just cask "src-tauri/target/dist/memo-$VERSION-macos-arm64.zip"
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: src-tauri/target/dist/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [version, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Holds SIGNING_KEY and TAP_TOKEN.
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HEAD_SHA: ${{ inputs.sha }}
      ARCHIVE: src-tauri/target/dist/memo-${{ needs.version.outputs.version }}-macos-arm64.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: just gitleaks
          cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: src-tauri/target/dist

      - name: Scan the app for secrets and home directory paths
        run: |
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/unpacked"
          just scan-app "$RUNNER_TEMP/unpacked/memo.app"

      - name: Tag the commit
        run: |
          if tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$VERSION" --jq .sha 2>/dev/null); then
            [[ "$tagged" == "$HEAD_SHA" ]] || { echo "::error::v$VERSION already tags $tagged"; exit 1; }
            echo "v$VERSION already tags $HEAD_SHA"
            exit 0
          fi
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          git config user.name "Fun Driven Stuff"
          git config user.email "stuff@fundriven.dev"
          git config gpg.format ssh
          git config user.signingkey "$key"
          git tag --sign "v$VERSION" -m "memo $VERSION" "$HEAD_SHA"
          gh auth setup-git
          git push origin "v$VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      # Drafted, filled, then published, as a published release may be immutable.
      - name: Release the app
        run: |
          if [[ "$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null)" == false ]]; then
            echo "v$VERSION is already released"
            exit 0
          fi
          gh release view "v$VERSION" >/dev/null 2>&1 \
            || gh release create "v$VERSION" --verify-tag --draft --title "memo $VERSION" --generate-notes
          gh release upload "v$VERSION" "$ARCHIVE" --clobber
          gh release edit "v$VERSION" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}

      # Skips a cask already at this version.
      - name: Push the app to the Homebrew tap
        uses: FunDrivenDev/homebrew-tap/.github/actions/publish-cask@4cadfc0c521cb71d38ea087046501c261e0e8dd5
        with:
          cask: memo
          version: ${{ needs.version.outputs.version }}
          archive: ${{ env.ARCHIVE }}
          definition: packaging/memo.rb
          token: ${{ secrets.TAP_TOKEN }}
          signing-key: ${{ secrets.SIGNING_KEY }}
