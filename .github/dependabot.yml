# Monthly, grouped updates keep the pinned actions and the Rust crates current without a
# pull request a day. New versions wait a week, so a compromised release is usually
# caught before it lands here.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      crates:
        patterns: ["*"]
