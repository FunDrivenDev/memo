[package]
name = "memo"
version = "0.1.0"
description = "Browse the plans, handoffs and reports Claude Code writes"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
name = "memo_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[dependencies]
tauri = { version = "~2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comrak = { version = "0.55", default-features = false }
ammonia = "4"
nucleo-matcher = "0.3"
notify-debouncer-mini = "0.7"
trash = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
